[platformio]
default_envs = esp32dev, esp32-s3-devkitc-1

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  crankyoldgit/IRremoteESP8266@^2.8.6
  bblanchon/ArduinoJson@^7.2.1
  esphome/ESPAsyncWebServer-esphome@^3.2.2
build_flags =
  -O2
  -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DIR_TX_PIN=4
  -DIR_RX_PIN=5

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DIR_TX_PIN=4
  -DIR_RX_PIN=5
  -DARDUINO_USB_CDC_ON_BOOT=1
