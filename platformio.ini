[env:esp32dev]
; Pinned so a new pioarduino release can never silently break the build.
; 55.03.311 = Arduino-ESP32 3.3.11 on ESP-IDF 5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    bblanchon/ArduinoJson @ ^7.0.0

board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

; Adds `pio run -t webflash`: firmware + web UI merged into one flashable file.
extra_scripts = post:scripts/merge_bins.py
